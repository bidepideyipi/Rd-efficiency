# 测试 SQL 执行配置（跳板机）。含口令，勿提交真实值。
# 可与 export-job.conf 共用 connect/tgtConnect/tables/时间片键。

testSqlDir = /opt/mig/sql/map/test
testOutDir = /opt/mig/out/test
connect = user/password@SOURCE
tgtConnect = user/password@TGT_SERVICE

start = 20240301
end = 20240401
interval = 1m
onError = stop
maxDiffLines = 50
# false：常规测试只执行总量和行明细；需要定位每日差异时再开启。
byDayCheck = false

# 单列表示源/目标时间列同名；不同名时写成：源时间列,目标时间列。
tables =
  IBPS_PAYMENTINIT = TRANDATE
  HVPS_PAYMENTINIT = TRANSDT,WORKDATE
