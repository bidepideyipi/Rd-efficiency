# 与脚本放在同一目录。export_by_map.sh 与 export_batch.sh 都只读本文件，不使用环境变量。
# connect 含口令，填入真实值后不要提交到仓库。

# SQL 模板目录，文件名为 {表名}.sql
sqlDir = /opt/mig/sql/map

# CSV 输出目录
outDir = /opt/mig/out

# SQLcl 连接串：user/password@SERVICE（仅 export_by_map.sh 使用）
connect = user/password@SERVICE

# 以下仅 export_batch.sh 使用。时间左闭右开。间隔只按天：1d、7d。
tmColumn = TRANDATE
start = 20240301
end = 20270301
interval = 1d

# stop：某片失败立即停；continue：记失败后继续，结束时仍返回非 0
onError = stop

# 表名或文件名，可省略 .sql。
# 竖线后面是这一张表的时间列，用来替换 SQL 里的 {{tmColumn}}。
# 不写竖线时，用上面的 tmColumn。
# 删掉整个 files 段，或留空，则导出 sqlDir 下全部 *.sql（不含子目录），都用 tmColumn。
files =
  BEPS_ACCTCHANGERSPBOOK
  BEPS_BATHOSTBOOKINIT
  BEPS_BATPACKAGEDETAILBOOK
  BEPS_BATPAYMENTFINAL
  BEPS_BATPAYMENTINIT
  BEPS_EXTPAYMENTDETAIL
  BEPS_PACKAGEDETAILBOOK
  BEPS_PAYMENTFINAL
  CBPS_BUSIFEEINFO
