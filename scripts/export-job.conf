# 与脚本放在同一目录。export_*/load_* 都只读本文件，不使用环境变量。
# connect / tgtConnect 含口令，填入真实值后不要提交到仓库。

# SQL 模板目录，文件名为 {表名}.sql
sqlDir = /opt/mig/sql/map

# .dat / .ctl 输出目录
outDir = /opt/mig/out

# sqlplus 连接串：user/password@SERVICE（export_by_map.sh 导出源库）
connect = user/password@SERVICE

# sqlldr 连接串：user/password@SERVICE（load_by_map.sh 装载目标库）
tgtConnect = user/password@TGT_SERVICE

# sqlldr 控制文件字符集（可选，默认 AL32UTF8）
ctlCharset = AL32UTF8

# sqlldr 装载方式：APPEND | TRUNCATE | REPLACE | INSERT（可选，默认 APPEND；写入 .ctl）
loadMode = APPEND

# sqlldr 运行参数（load_by_map.sh）
sqlldrErrors = 100
sqlldrRows = 5000
sqlldrDirect = false

# 以下仅 batch 使用。时间左闭右开。间隔只按自然月：1m、3m。
# start/end 建议用月初（…01），避免月末加月溢出。
start = 20240301
end = 20270301
interval = 1m

# stop：某片失败立即停；continue：记失败后继续，结束时仍返回非 0
onError = stop

# 每张表必须单独配置时间列（替换 SQL 中 {{tmColumn}}），列名不限集合。
