server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mig:
  default-export-dir: ${user.home}/mig/sql/map
  upload-temp-dir: ${java.io.tmpdir}/mapsql-upload
  header-row: 3
  source-alias: s
  time-predicate: string
  tm-format: YYYYMMDDHH24MISS
  date-format: YYYYMMDDHH24MISS
  length-overflow: substr
  include-header-comment: true
  join-condition-conflict: error
  require-sql-rule-when-present: false
  write-meta: true
  # 数据标准规则库（SQLite）
  standard-db-path: ${user.home}/mig/data-standard.db
  scan:
    default-project-dir: ""
  # OceanBase 数据源（库↔Excel 对比 / 数标扫描）。密码勿提交仓库。
