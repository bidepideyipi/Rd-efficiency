<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>映射 SQL 生成器</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1c2430;
      --muted: #5b6775;
      --line: #d7dee7;
      --accent: #0b6e4f;
      --accent-soft: #e6f4ef;
      --danger: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9ebe3 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #e7eef8 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(28, 36, 48, 0.04);
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: end;
    }
    .row > div { flex: 1; }
    button, .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #eef2f6;
      color: var(--text);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .drop {
      border: 1.5px dashed #9bb0c2;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      background: #f8fafc;
      color: var(--muted);
    }
    .drop.drag {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .sheets {
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .sheets label.item {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
      color: var(--text);
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .checks {
      display: flex;
      gap: 16px;
      margin: 12px 0;
      color: var(--muted);
      font-size: 14px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f1720;
      color: #e8eef5;
      border-radius: 10px;
      padding: 14px;
      font-size: 12px;
      max-height: 420px;
      overflow: auto;
    }
    .ok { color: var(--ok); }
    .err { color: var(--danger); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
<main>
  <h1>映射 SQL 生成器 <span class="pill">V0.4 Excel → 一表一 SQL</span></h1>
  <p class="sub">上传映射 Excel，配置导出目录，按目标表生成带时间占位符的 SELECT 文件。</p>

  <section class="card">
    <label>SQL 文件输出目录</label>
    <div class="row">
      <div>
        <input id="exportDir" type="text" placeholder="/path/to/sql/map"/>
      </div>
      <button class="secondary" type="button" id="btnCheckDir">检测目录</button>
    </div>
    <p id="dirStatus" class="sub" style="margin:8px 0 0"></p>
  </section>

  <section class="card">
    <label>上传映射 Excel（.xlsx）</label>
    <div class="drop" id="drop">
      <p>拖拽文件到此处，或点击选择</p>
      <input id="file" type="file" accept=".xlsx" style="margin-top:10px"/>
      <p id="fileInfo" class="sub" style="margin-top:10px"></p>
    </div>
  </section>

  <section class="card">
    <label>目标表（业务 Sheet）</label>
    <div class="toolbar">
      <button class="secondary" type="button" id="btnAll">全选</button>
      <button class="secondary" type="button" id="btnNone">清空</button>
    </div>
    <div class="sheets" id="sheets"><em style="color:#5b6775">请先上传 Excel</em></div>
    <div class="checks">
      <label class="item"><input type="checkbox" id="overwrite" checked/> 覆盖已存在文件</label>
      <label class="item"><input type="checkbox" id="stopOnError"/> 遇错即停</label>
    </div>
    <button type="button" id="btnGenerate" disabled>生成 SQL</button>
  </section>

  <section class="card">
    <label>生成结果</label>
    <pre id="result">等待操作…</pre>
  </section>
</main>
<script>
  let uploadId = null;
  const $ = (id) => document.getElementById(id);

  async function init() {
    const res = await fetch('/api/config/export-dir');
    const data = await res.json();
    $('exportDir').value = data.defaultExportDir || '';
    renderDirStatus(data.status);
  }

  function renderDirStatus(status) {
    if (!status) return;
    if (status.writable) {
      $('dirStatus').innerHTML = '<span class="ok">目录可用：</span>' + status.path;
    } else {
      $('dirStatus').innerHTML = '<span class="err">不可用：</span>' + (status.error || status.path);
    }
  }

  $('btnCheckDir').onclick = async () => {
    const res = await fetch('/api/config/export-dir', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ path: $('exportDir').value })
    });
    const data = await res.json();
    renderDirStatus(data);
  };

  const drop = $('drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      $('file').files = e.dataTransfer.files;
      uploadFile(e.dataTransfer.files[0]);
    }
  });
  $('file').onchange = () => {
    if ($('file').files[0]) uploadFile($('file').files[0]);
  };

  async function uploadFile(file) {
    $('fileInfo').textContent = '上传中：' + file.name;
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/excel/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) {
      $('fileInfo').innerHTML = '<span class="err">' + (data.error || '上传失败') + '</span>';
      return;
    }
    uploadId = data.uploadId;
    $('fileInfo').innerHTML = '<span class="ok">已上传</span> ' + data.fileName + '（' + data.sheetCount + ' 张业务表）';
    renderSheets(data.sheets || []);
    $('btnGenerate').disabled = false;
  }

  function renderSheets(sheets) {
    const box = $('sheets');
    if (!sheets.length) {
      box.innerHTML = '<em>未识别到业务表</em>';
      return;
    }
    box.innerHTML = sheets.map(s =>
      '<label class="item"><input type="checkbox" name="table" value="' + s + '" checked/> ' + s + '</label>'
    ).join('');
  }

  $('btnAll').onclick = () => document.querySelectorAll('input[name=table]').forEach(c => c.checked = true);
  $('btnNone').onclick = () => document.querySelectorAll('input[name=table]').forEach(c => c.checked = false);

  $('btnGenerate').onclick = async () => {
    if (!uploadId) return;
    const tables = [...document.querySelectorAll('input[name=table]:checked')].map(c => c.value);
    $('result').textContent = '生成中…';
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        uploadId,
        exportDir: $('exportDir').value,
        tables,
        overwrite: $('overwrite').checked,
        stopOnError: $('stopOnError').checked
      })
    });
    const data = await res.json();
    if (!res.ok) {
      $('result').textContent = data.error || JSON.stringify(data, null, 2);
      return;
    }
    const lines = [];
    lines.push('导出目录: ' + data.exportDir);
    lines.push('成功: ' + data.succeeded + '  失败: ' + data.failed);
    lines.push('');
    (data.tables || []).forEach(t => {
      lines.push((t.success ? '[OK] ' : '[FAIL] ') + t.table);
      if (t.outputFile) lines.push('  -> ' + t.outputFile);
      if (t.error) {
        String(t.error).split('\n').forEach(line => lines.push('  ' + line));
      }
      const msgs = t.messages || [];
      const errors = msgs.filter(m => String(m).startsWith('ERROR'));
      const others = msgs.filter(m => !String(m).startsWith('ERROR'));
      // 失败时优先完整展示 ERROR（含 Excel 行列）；其余最多 5 条
      (t.success ? others.slice(0, 5) : errors.concat(others.slice(0, 5))).forEach(m => lines.push('  ' + m));
      if (t.success && others.length > 5) lines.push('  ...');
      if (!t.success && others.length > 5) lines.push('  ... 另有 WARN/INFO ' + (others.length - 5) + ' 条');
      lines.push('');
    });
    $('result').textContent = lines.join('\n');
  };

  init().catch(e => $('dirStatus').textContent = e.message);
</script>
</body>
</html>
